server:
  port: 8080

spring:
  application:
    name: BovinBI
  datasource:
    # 默认使用 H2 文件数据库(MySQL 兼容模式),零安装即可演示;生产用 --spring.profiles.active=mysql 切换
    url: jdbc:h2:file:./data/bovinbi;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

bovin:
  chat:
    # 查询引擎: pipeline=固定管线(默认,行为与旧版一致) | agent=工具调用循环(需 provider=openai,详见 docs/06)
    engine: agent
    # LLM 生成失败/超时时是否回退到内置规则引擎(保证演示不中断)
    fallback-to-rule: true
    max-rows: 1000
    query-timeout-seconds: 8
    # Agent 模式运行预算:自主性边界在工具层强制(总调用/SQL执行/Schema/维度值 各自限次)
    agent:
      max-tool-calls: 12
      max-sql-executions: 3
      max-schema-calls: 2
      max-value-calls: 4
      preview-rows: 8
      memory-messages: 20
      # Agent 循环内单次 LLM 调用:短超时 + 零 HTTP 重试(工具循环自带"报错回喂重试"语义;
      # 若沿用 llm.timeout-seconds=40s×2次重试,慢端点下多轮循环可拖到 80s+ 才降级,前端早已超时)
      llm-timeout-seconds: 30
      llm-max-retries: 0
    # multi-agent 引擎(engine=multi-agent 时生效):SQL Agent → Reviewer → Repair Agent
    multi-agent:
      max-repairs: 2
      llm-review: true
  cache:
    ttl-seconds: 600
    max-size: 512
    # 语义缓存二次命中(向量相似度回退):默认关闭;开启后精确 key 未命中时按余弦相似度召回
    semantic-enabled: false
    semantic-threshold: 0.92
  rag:
    # Schema 混合召回(词面打分 + 向量重排 + topK 截断):开启后接管管线第 3 步;
    # 字段数<=top-k 时行为与词面版一致(演示数据集 29 字段 < 32,零变化)
    enabled: false
    top-k: 32
    embedding:
      provider: hash   # hash=进程内零依赖(演示/测试) / openai=OpenAI 兼容 /embeddings(生产)
      base-url: ""
      api-key: ""
      model: text-embedding-3-small
  gateway:
    # 轻量 LLM 网关:开启后暴露 POST /gateway/v1/chat/completions(OpenAI 兼容),
    # 业务侧把 bovin.llm.base-url 指向 http://localhost:8080/gateway/v1 即接入,代码零改动
    enabled: false
    cache-ttl-seconds: 300
    timeout-seconds: 60
    breaker-threshold: 3
    breaker-open-seconds: 60
    api-keys: {}       # 调用方 key -> RPM;留空=不鉴权不限流(演示)
    providers:
      - name: deepseek
        base-url: https://api.deepseek.com
        api-key: ${LLM_API_KEY:}
        model: deepseek-chat
        priority: 1
  security:
    jwt-secret: bovinbi-dev-secret-key-please-change-in-prod-0123456789
    jwt-ttl-hours: 24
  llm:
    # LangChain4j 接入: provider: mock=离线规则引擎(无需API Key,默认) / openai=OpenAI 兼容协议
    # base-url 可选: DeepSeek https://api.deepseek.com / 通义千问 https://dashscope.aliyuncs.com/compatible-mode/v1 / GLM / OpenAI
    # 接入真实大模型: export LLM_API_KEY=sk-xxx 后加 --spring.profiles.active=dev,详见 application-dev.yml
    provider: mock
    base-url: https://api.deepseek.com
    api-key:
    model: deepseek-chat
    temperature: 0.0
    timeout-seconds: 40
    max-retries: 2
    log-requests: false
    log-responses: false
  dwh:
    # 留空 = 复用主数据源(演示);生产建议独立只读数据源
    url: ""
    username: ""
    password: ""

logging:
  level:
    com.eighthours.bovinbi: info
