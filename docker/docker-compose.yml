version: "3.8"

# BovinBI 存储栈 + 后端:MySQL 8(平台库+数仓)+ PostgreSQL/pgvector(意图向量库)+ 后端(含前端静态页)
# 一键启停:./docker/start-all.sh  |  ./docker/stop-all.sh
# 后端容器内经服务名互连(mysql:3306 / pgvector:5432);本机直连用宿主端口(MySQL@3308 / pgvector@5433,
# 避开本机已装的 3306/5432)

services:
  mysql:
    image: mysql:8.4
    container_name: bovinbi-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: bovin_bi
      MYSQL_USER: bovin
      MYSQL_PASSWORD: bovin123
      TZ: Asia/Shanghai
    volumes:
      - bovinbi-mysql-data:/var/lib/mysql
      - ../sql/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubovin", "-pbovin123"]
      interval: 5s
      timeout: 3s
      retries: 30

  # rag1 意图识别向量库(pgvector 镜像自带 vector 扩展;建表/建 HNSW 索引由 PgVectorStore 幂等完成)
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: bovinbi-pgvector
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bovin_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bovin123
      TZ: Asia/Shanghai
    volumes:
      - bovinbi-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bovin_rag"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 后端(构建自仓库根 Dockerfile;启动自动建表+装载两个数据集+灌 rag1 语料)
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bovinbi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BOVIN_MYSQL_URL: jdbc:mysql://mysql:3306/bovin_bi?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      BOVIN_MYSQL_USER: bovin
      BOVIN_MYSQL_PASSWORD: bovin123
      BOVIN_PG_URL: jdbc:postgresql://pgvector:5432/bovin_rag
      BOVIN_PG_USER: postgres
      BOVIN_PG_PASSWORD: bovin123
      BOVIN_PYTHON_AGENT_URL: http://python-agent:8090
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy

  # AI 能力层:Python Agent(经 MCP 回环调用 backend 的工具,不直连数据库)
  python-agent:
    build:
      context: ../python-agent
      dockerfile: Dockerfile
    container_name: bovinbi-python-agent
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      JAVA_MCP_URL: http://backend:8080/mcp
      MCP_API_KEY: bovin-mcp-demo
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      TZ: Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bovinbi-mysql-data:
  bovinbi-pgvector-data:
