version: "3.8"

# BovinBI 存储栈:MySQL 8 承载平台元数据 + 分析数据仓(表名 dwh_ 前缀区分)
# 用法: docker compose -f docker/docker-compose.yml up -d
# 后端默认即连本实例(localhost:3308),无需任何 profile;宿主端口避开 3306/3307 常见占用

services:
  mysql:
    image: mysql:8.4
    container_name: bovinbi-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: bovin_bi
      MYSQL_USER: bovin
      MYSQL_PASSWORD: bovin123
      TZ: Asia/Shanghai
    volumes:
      - bovinbi-mysql-data:/var/lib/mysql
      - ../sql/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  bovinbi-mysql-data:
