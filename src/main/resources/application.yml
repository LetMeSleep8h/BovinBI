server:
  port: 8080

spring:
  application:
    name: BovinBI
  datasource:
    # MySQL 8(平台库 + 数仓合一;docker/docker-compose.yml up -d 即得本实例,宿主机映射 3308)
    # 生产拆分:bovin.dwh.url 指向独立只读数仓,平台库/分析库分离
    url: ${BOVIN_MYSQL_URL:jdbc:mysql://localhost:3308/bovin_bi?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${BOVIN_MYSQL_USER:bovin}
    password: ${BOVIN_MYSQL_PASSWORD:bovin123}
  sql:
    init:
      # 幂等建表(CREATE TABLE IF NOT EXISTS);docker-compose 首次初始化与本脚本二选一皆可
      mode: always
      schema-locations: classpath:schema-mysql.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

bovin:
  chat:
    # 查询引擎: pipeline=固定管线(默认,行为与旧版一致) | agent=工具调用循环(需 provider=openai,详见 docs/06)
    #           | multi-agent=三Agent流水线 | orchestra=多Agent编排(Supervisor意图路由+声明式工作流)
    engine: ${BOVIN_CHAT_ENGINE:agent}
    # LLM 生成失败/超时时是否回退到内置规则引擎(保证演示不中断)
    fallback-to-rule: true
    max-rows: 1000
    query-timeout-seconds: 8
    # Agent 模式运行预算:自主性边界在工具层强制(总调用/SQL执行/Schema/维度值 各自限次)
    agent:
      max-tool-calls: 12
      max-sql-executions: 3
      max-schema-calls: 2
      max-value-calls: 4
      preview-rows: 8
      memory-messages: 20
      # Agent 循环内单次 LLM 调用:短超时 + 零 HTTP 重试(工具循环自带"报错回喂重试"语义;
      # 若沿用 llm.timeout-seconds=40s×2次重试,慢端点下多轮循环可拖到 80s+ 才降级,前端早已超时)
      llm-timeout-seconds: ${BOVIN_AGENT_LLM_TIMEOUT_SECONDS:60}
      llm-max-retries: 0
    # multi-agent 引擎(engine=multi-agent 时生效):SQL Agent → Reviewer → Repair Agent
    multi-agent:
      max-repairs: 2
      llm-review: true
    # orchestra 引擎(engine=orchestra 时生效):Supervisor 路由(rag1 意图→闲聊直答/取数工作流)
    # + 声明式工作流(schema → [写→确定性审→语义审]×修复环 → 执行 → 洞察)
    orchestra:
      max-repairs: 2      # 修复环轮数(首轮生成 + N 轮定向修复)
      llm-review: true    # 语义审查(关闭则环内只跑守护/时间对账,整步跳过)
  cache:
    ttl-seconds: 600
    max-size: 512
    # 语义缓存二次命中(向量相似度回退):默认关闭;开启后精确 key 未命中时按余弦相似度召回
    semantic-enabled: false
    semantic-threshold: 0.92
  rag:
    # Schema 混合召回(词面打分 + 向量重排 + topK 截断):开启后接管管线第 3 步;
    # 字段数<=top-k 时行为与词面版一致(演示数据集 29 字段 < 32,零变化)
    enabled: false
    top-k: 32
    embedding:
      provider: hash   # hash=进程内零依赖(演示/测试) / openai=OpenAI 兼容 /embeddings(生产)
      base-url: ""
      api-key: ""
      model: text-embedding-3-small
  rag1:
    # 意图识别增强(RAG,问题级):标注问例向量化入 pgvector,新问题召回相似问例 → 意图投票 + 少样本注入
    # 向量库唯一实现是 PostgreSQL+pgvector(compose 已带实例 @ localhost:5433,避开本机已装的 5432);
    # PG 不可达 → 打 WARN 后 Bean 缺席,闲聊分流回落关键词版,主链路不受影响
    enabled: true
    url: ${BOVIN_PG_URL:jdbc:postgresql://localhost:5433/bovin_rag}
    username: ${BOVIN_PG_USER:postgres}
    password: ${BOVIN_PG_PASSWORD:bovin123}
    table: rag1_intent_example
    top-k: 3            # 召回相似问例数
    threshold: 0.55     # 余弦相似度阈值(hash 实测:改写>=0.65,噪声<=0.45),低于则不判意图(UNKNOWN)
  gateway:
    # 轻量 LLM 网关:开启后暴露 POST /gateway/v1/chat/completions(OpenAI 兼容),
    # 业务侧把 bovin.llm.base-url 指向 http://localhost:8080/gateway/v1 即接入,代码零改动
    enabled: false
    cache-ttl-seconds: 300
    timeout-seconds: 60
    breaker-threshold: 3
    breaker-open-seconds: 60
    api-keys: {}       # 调用方 key -> RPM;留空=不鉴权不限流(演示)
    providers:
      - name: deepseek
        base-url: https://api.deepseek.com
        api-key: ${LLM_API_KEY:}
        model: deepseek-chat
        priority: 1
  security:
    jwt-secret: bovinbi-dev-secret-key-please-change-in-prod-0123456789
    jwt-ttl-hours: 24
    # 登录加固:同一用户名连续失败 max-login-failures 次 → 锁定 login-lock-seconds 秒(防爆破)
    max-login-failures: 5
    login-lock-seconds: 900
    # 自助注册(POST /api/auth/register);生产建议 false,走管理员开户
    register-enabled: true
  llm:
    # LangChain4j 接入: provider: mock=离线规则引擎(无需API Key,默认) / openai=OpenAI 兼容协议
    # base-url 可选: DeepSeek https://api.deepseek.com / 通义千问 https://dashscope.aliyuncs.com/compatible-mode/v1 / GLM / OpenAI
    # 接入真实大模型: export LLM_API_KEY=sk-xxx 后加 --spring.profiles.active=dev,详见 application-dev.yml
    # provider=mock 时零依赖离线(规则兜底);docker 部署 export LLM_API_KEY + BOVIN_LLM_PROVIDER=openai 即点亮 LLM
    provider: ${BOVIN_LLM_PROVIDER:mock}
    base-url: ${BOVIN_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${BOVIN_LLM_MODEL:deepseek-chat}
    temperature: 0.0
    timeout-seconds: ${BOVIN_LLM_TIMEOUT_SECONDS:90}
    max-retries: 2
    log-requests: false
    log-responses: false
  dwh:
    # 留空 = 复用主数据源(演示);生产建议独立只读数据源
    url: ""
    username: ""
    password: ""
  mcp:
    # 工具统一按 MCP 协议管理:本地工具(getSchema/getColumnValues/executeSql)与远程
    # MCP server 的工具在 McpToolRegistry 合并成一份目录;Agent 循环与对外 /mcp 端点
    # 共用同一执行入口(预算/守护/轨迹同一套)。
    # Python Agent(engine=python)的工具调用也回环到这里 —— 安全边界仍在 Java
    server-enabled: true
    api-keys: [bovin-mcp-demo]   # /mcp 鉴权 Bearer key;Python Agent 的 MCP_API_KEY 需与之一致
  python-agent:
    # AI 能力层(独立 Python 服务,提问时可选 engine=python):
    # 不可达时自动降级 Java 引擎,标签 PYTHON(降级JAVA)
    url: ${BOVIN_PYTHON_AGENT_URL:http://localhost:8090}
    timeout-seconds: 90
    servers: []             # 远程 MCP server 列表,工具以 "服务名__工具名" 进入统一目录
    # servers:
    #   - name: weather
    #     url: http://localhost:9090/mcp
    #     api-key: ""
    #     enabled: true

logging:
  level:
    com.eighthours.bovinbi: info
